name: Build and Test Functions on ww500_md

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

# Make and build the WW500_MD application
jobs:
  build:
    name: build (${{ matrix.cis_model }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Both camera variants must build, so name them here rather than relying
        # on the CIS_SUPPORT_INAPP_MODEL default in ww500_md.mk. That default is
        # a developer convenience and gets flipped while working: bf222730 moved
        # it from cis_hm0360 to cis_imx708, which silently took the HM0360 build
        # out of this check.
        cis_model: [cis_imx708, cis_hm0360]

    env:
      # Matches the pinned toolchain: Arm GNU 14.3.rel1, the same version
      # build_and_upload_firmware.yml uses and the one the app is developed and
      # bench-tested against. This check was still on 14.2, so the gate was not
      # compiling with the compiler anybody actually ships.
      COMPILER_VERSION: "14.3"
    
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Set up build dependencies
      run: |
        TOOLCHAIN_URL="https://developer.arm.com/-/media/Files/downloads/gnu/${COMPILER_VERSION}.rel1/binrel/"
        TOOL_XZ="arm-gnu-toolchain-${COMPILER_VERSION}.rel1-x86_64-arm-none-eabi.tar.xz"
        wget -q $TOOLCHAIN_URL$TOOL_XZ
        tar -xf $TOOL_XZ
        sudo cp -r arm-gnu-toolchain-${COMPILER_VERSION}.rel1-x86_64-arm-none-eabi /usr/local/
        echo "/usr/local/arm-gnu-toolchain-${COMPILER_VERSION}.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

    - name: Update APP_TYPE variable to ww500_md
      run: |
            sed -i 's/APP_TYPE = .*/APP_TYPE = ww500_md/' EPII_CM55M_APP_S/app/ww_projects/ww.mk

    - name: Build ww500_md
      run: |
        cd EPII_CM55M_APP_S/
        make clean
        make CIS_SUPPORT_INAPP_MODEL=${{ matrix.cis_model }}