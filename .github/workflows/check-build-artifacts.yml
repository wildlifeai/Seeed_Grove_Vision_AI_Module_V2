name: No build artifacts in PRs

# The SDK library .mk files copy each archive they build back into prebuilt_libs/
# (e.g. library/common/common.mk, middleware/fatfs/fatfs.mk), and image generation
# runs as part of `all:` (mk/image_gen.mk). The files a normal build rewrites,
# libcommon.a, libfatfs.a, libtrustzone_cfg.a and output.img, are not tracked
# (#198): the build recreates them every time and never reads a committed copy.
#
# This check is the backstop for everything else in those paths:
#
#   * prebuilt_libs/**/*.a          the other archives are real inputs. The build
#                                   links them as committed, so a changed one
#                                   silently changes what ships, with no visible
#                                   source diff. A build that recompiles one
#                                   (e.g. `make WW500_FAST_LIBS=n`) dirties it.
#   * we2_image_gen_local_dpd/...   image generator outputs
#
# That is why this is a hard failure rather than a warning.
#
# To get past this check, restore the files rather than committing them:
#   git checkout origin/dev -- EPII_CM55M_APP_S/prebuilt_libs we2_image_gen_local_dpd
#
# If a change to these files is genuinely intended (a real toolchain or SDK
# update), label the PR 'intended-artifact-change' and say why in the PR body.

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'intended-artifact-change') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for build artifacts in the diff
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 --quiet || true

          # Only files this PR actually changed, against the merge base
          CHANGED=$(git diff --name-only "$(git merge-base "$BASE" HEAD)" HEAD)

          OFFENDERS=$(printf '%s\n' "$CHANGED" | grep -E \
            -e '^EPII_CM55M_APP_S/prebuilt_libs/.*\.a$' \
            -e '^we2_image_gen_local_dpd/output_case1_sec_wlcsp/' \
            -e '(^|/)NUL$' \
            -e '(^|/)objs\.in$' \
            -e '(^|/)obj_[^/]*/' || true)

          if [ -z "$OFFENDERS" ]; then
            echo "No build artifacts in this PR."
            exit 0
          fi

          echo "::error::This PR modifies build artifacts. See the notes at the top of .github/workflows/check-build-artifacts.yml"
          echo
          echo "Build artifacts changed by this PR:"
          printf '  %s\n' $OFFENDERS
          echo
          echo "These are rewritten by a normal build, so they are almost certainly"
          echo "unintended. To restore them:"
          echo
          echo "    git checkout origin/${{ github.base_ref }} -- EPII_CM55M_APP_S/prebuilt_libs we2_image_gen_local_dpd"
          echo "    git commit -m 'revert build artifacts'"
          echo
          echo "If the change IS intended, label this PR 'intended-artifact-change'."
          exit 1
